name: Kotlin SDK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * 1'

permissions:
  contents: read

concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Require the runner's preinstalled Android platform and reviewed locks
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -f "$sdk_root/platforms/android-35/android.jar"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          test -s core/gradle.lockfile
          test -s android/gradle.lockfile
          test -s buildscript-gradle.lockfile
      - name: Scan locked runtime, test, documentation and build dependencies
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=core/gradle.lockfile
            --lockfile=android/gradle.lockfile
            --lockfile=buildscript-gradle.lockfile
            --recursive
            .
      - name: Verify locked dependency resolution
        run: ./gradlew resolveAndLockAll --no-daemon
      - name: Build JVM core, compile README examples, run JUnit and conformance
        run: ./gradlew :core:build :core:conformance --no-daemon
      - name: Build Android adapter and run its JVM unit tests using platform API 35
        run: ./gradlew :android:build :android:test --no-daemon
      - name: Generate API documentation with undocumented declarations treated as errors
        run: ./gradlew :core:dokkaGenerate :android:dokkaGenerate --no-daemon
      - name: Generate Maven metadata for review
        run: ./gradlew :core:generatePomFileForMavenPublication :android:generatePomFileForMavenPublication --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kotlin-sdk-reports
          path: |
            core/build/reports/
            core/build/test-results/
            core/build/dokka/
            android/build/reports/
            android/build/test-results/
            android/build/dokka/
            android/build/libs/
            core/build/libs/
            core/build/publications/
            android/build/publications/
