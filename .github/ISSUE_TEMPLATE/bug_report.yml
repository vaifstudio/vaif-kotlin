name: Bug report
description: Report a defect in the Kotlin SDK.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Report vulnerabilities privately to security@vaif.studio. Remove credentials and personal data from reports.
  - type: input
    id: version
    attributes:
      label: SDK version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Kotlin, JDK, operating system and Android versions
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the error code and request ID when available.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: kotlin
    validations:
      required: true
